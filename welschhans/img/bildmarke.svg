<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Bildmarke Welschhans: Faust mit Blitz vor der Sonne">
  <defs>
    <radialGradient id="sun" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFD966"/>
      <stop offset="1" stop-color="#F7B500"/>
    </radialGradient>
    <clipPath id="disc"><circle cx="50" cy="50" r="47"/></clipPath>
  </defs>
  <circle cx="50" cy="50" r="47" fill="url(#sun)"/>
  <g clip-path="url(#disc)">
    <!-- Blitz -->
    <polygon points="56,-6 28,50 46,50 36,106 76,40 58,40 70,-6" transform="rotate(-42 50 50)" fill="#FFE86B" stroke="#B5410A" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- Unterarm -->
    <path d="M40 62 h20 v42 h-20 z" fill="#E8641B" stroke="#7A2600" stroke-width="1.6"/>
    <!-- Faust -->
    <rect x="28" y="30" width="44" height="36" rx="10" fill="#F2731C" stroke="#7A2600" stroke-width="1.6"/>
    <path d="M39 30.8 v12 M50 30.8 v12 M61 30.8 v12" stroke="#7A2600" stroke-width="1.6" stroke-linecap="round" fill="none"/>
    <!-- Daumen -->
    <path d="M62 46 c10 -3 14 4 12 11 c-2 7 -7 10 -14 9" fill="#F2731C" stroke="#7A2600" stroke-width="1.6" stroke-linejoin="round"/>
  </g>
  <circle cx="50" cy="50" r="47" fill="none" stroke="#C97A00" stroke-width="1.2"/>
</svg>
